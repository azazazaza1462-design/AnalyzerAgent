services:
  postgres:
    image: postgres:18-alpine
    container_name: analyzers-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyzers_dev}
      POSTGRES_USER: ${POSTGRES_USER:-lendlogic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lendlogic_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lendlogic} -d ${POSTGRES_DB:-analyzers_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:2025.1
    container_name: analyzers-seq
    ports:
      - "${SEQ_PORT:-5342}:80"
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data

volumes:
  postgres_data:
  seq_data:
